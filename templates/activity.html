<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeBridge Activity</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <img class="brand-logo" src="/static/assets/logo.png" alt="LifeBridge" />
          <div>
            <span class="brand-name">LifeBridge</span>
            <span class="brand-sub">Health monitoring</span>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a class="nav-item" href="/">Dashboard</a>
          <a class="nav-item" href="/status">Status</a>
          <a class="nav-item" href="/alerts">Alerts</a>
          <a class="nav-item is-active" href="/activity">Activity</a>
          <a class="nav-item" href="/config">Configuration</a>
        </nav>
      </aside>

      <main class="app-main">
        <header class="app-header">
          <div>
            <h1>Activity</h1>
            <p class="subtitle">Event timeline and summary</p>
          </div>
          <div class="header-actions">
            <button id="authBtn" class="btn btn-outline" type="button">Login</button>
          </div>
        </header>

        <section class="grid">
          <section class="card" id="activityCard">
            <div class="card-header">
              <h2>Recent Activity</h2>
              <span class="muted">Latest 30 events</span>
            </div>
            <div class="activity-strip" id="activityStrip"></div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Time</th>
                    <th>Type</th>
                    <th>State</th>
                    <th>Confidence</th>
                  </tr>
                </thead>
                <tbody id="activityTable">
                  <tr>
                    <td colspan="4" class="muted">No recent activity</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </section>
      </main>
    </div>

    <script src="/static/activity-page.js"></script>
  </body>
</html>
