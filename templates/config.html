<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeBridge Configuration</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <img class="brand-logo" src="/static/assets/logo.png" alt="LifeBridge" />
          <div>
            <span class="brand-name">LifeBridge</span>
            <span class="brand-sub">Health monitoring</span>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a class="nav-item" href="/">Dashboard</a>
          <a class="nav-item" href="/status">Status</a>
          <a class="nav-item" href="/alerts">Alerts</a>
          <a class="nav-item" href="/activity">Activity</a>
          <a class="nav-item is-active" href="/config">Configuration</a>
        </nav>
      </aside>

      <main class="app-main">
        <header class="app-header">
          <div>
            <h1>Configuration</h1>
            <p class="subtitle">Tune detection thresholds</p>
          </div>
          <div class="header-actions">
            <button id="authBtn" class="btn btn-outline" type="button">Login</button>
          </div>
        </header>

        <section class="grid">
          <section class="card" id="configCard">
            <div class="card-header">
              <h2>Configuration</h2>
              <span class="muted">Update thresholds</span>
            </div>
            <form id="configForm" class="form-grid">
              <label>
                Alert threshold
                <input type="number" step="0.01" min="0" max="1" id="alertThreshold" />
              </label>
              <label>
                High severity
                <input type="number" step="0.01" min="0" max="1" id="highSeverity" />
              </label>
              <label>
                Fall probability
                <input type="number" step="0.01" min="0" max="1" id="fallProbability" />
              </label>
              <label>
                Device ID
                <input type="text" id="deviceId" />
              </label>
              <div class="form-actions">
                <button class="btn" type="submit">Save</button>
                <span id="configStatus" class="muted"></span>
              </div>
            </form>
          </section>
        </section>
      </main>
    </div>

    <script src="/static/config-page.js"></script>
  </body>
</html>
